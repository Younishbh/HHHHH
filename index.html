<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الروايات - النسخة الخاصة</title>
    
    <!-- تحميل خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- تحميل أيقونات Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- إعدادات الخط -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* إخفاء العناصر الخاصة بالآدمن افتراضياً */
        .admin-only { display: none !important; }
        .show-admin .admin-only { display: flex !important; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 via-white to-blue-50 text-gray-800" id="mainBody">

    <!-- الرأس (Header) -->
    <header class="bg-gradient-to-r from-purple-600 to-blue-600 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-6">
            <div class="flex flex-col md:flex-row items-center justify-between mb-6 gap-4">
                <div class="flex items-center gap-3">
                    <i data-lucide="book-open" class="w-10 h-10"></i>
                    <h1 class="text-3xl font-bold">مكتبة الروايات</h1>
                </div>
                <div class="flex gap-4 items-center">
                    <!-- زر تسجيل دخول الآدمن -->
                    <button id="loginBtn" onclick="adminLogin()" class="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg transition text-sm">
                        🔒 دخول المشرف
                    </button>
                    
                    <!-- زر الخروج (يظهر فقط للمشرف) -->
                    <button id="logoutBtn" onclick="adminLogout()" class="admin-only px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition text-sm">
                        خروج
                    </button>

                    <!-- زر الإضافة (يظهر فقط للمشرف) -->
                    <button onclick="openAddModal()" class="admin-only px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition font-semibold items-center gap-2">
                        <span class="text-xl">+</span>
                        إضافة رواية
                    </button>
                </div>
            </div>
            
            <!-- شريط البحث -->
            <div class="relative max-w-2xl mx-auto">
                <i data-lucide="search" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                <input
                    type="text"
                    placeholder="ابحث عن روايات..."
                    class="w-full pr-12 pl-4 py-3 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-300 shadow-sm"
                    oninput="handleSearch(this.value)"
                />
            </div>
        </div>
    </header>

    <!-- الإحصائيات -->
    <div class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-md p-6 flex items-center gap-4">
                <div class="bg-purple-100 p-4 rounded-full"><i data-lucide="book-open" class="w-8 h-8 text-purple-600"></i></div>
                <div><p class="text-gray-600 text-sm">مجموع الروايات</p><p class="text-2xl font-bold text-gray-800" id="totalNovelsCount">0</p></div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 flex items-center gap-4">
                <div class="bg-blue-100 p-4 rounded-full"><i data-lucide="trending-up" class="w-8 h-8 text-blue-600"></i></div>
                <div><p class="text-gray-600 text-sm">المفضلة</p><p class="text-2xl font-bold text-gray-800" id="favoritesCount">0</p></div>
            </div>
            <!-- زر استعادة البيانات الأصلية -->
            <div class="bg-white rounded-xl shadow-md p-6 flex items-center justify-between admin-only">
                <div class="flex items-center gap-4">
                    <div class="bg-red-100 p-4 rounded-full"><i data-lucide="database" class="w-8 h-8 text-red-600"></i></div>
                    <div><p class="text-gray-600 text-sm">تحكم البيانات</p><p class="text-sm font-bold text-gray-800">حذف التغييرات</p></div>
                </div>
                <button onclick="resetData()" class="text-red-600 text-sm underline hover:text-red-800">استعادة المصنع</button>
            </div>
        </div>

        <!-- شبكة الروايات -->
        <div id="novelsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- مودال الإضافة -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 overflow-y-auto" onclick="closeAddModal()">
        <div class="bg-white rounded-2xl max-w-2xl w-full my-8" onclick="event.stopPropagation()">
            <div class="bg-gradient-to-r from-purple-600 to-blue-600 text-white p-6 rounded-t-2xl flex justify-between items-center">
                <h2 class="text-2xl font-bold">إضافة رواية (مشرف فقط)</h2>
                <button onclick="closeAddModal()" class="text-white hover:bg-white/20 rounded-full p-2">✕</button>
            </div>
            <form onsubmit="handleAddSubmit(event)" class="p-8 space-y-6">
                <!-- نفس حقول الإدخال السابقة -->
                <div><label class="block font-semibold mb-2">عنوان الرواية *</label><input type="text" name="title" required class="w-full px-4 py-3 border border-gray-300 rounded-lg"></div>
                <div><label class="block font-semibold mb-2">المؤلف *</label><input type="text" name="author" required class="w-full px-4 py-3 border border-gray-300 rounded-lg"></div>
                <div>
                    <label class="block font-semibold mb-2">التصنيف</label>
                    <select name="category" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                        <option>خيال علمي</option><option>غموض</option><option>رومانسي</option><option>فانتازيا</option><option>واقعية</option>
                    </select>
                </div>
                <div><label class="block font-semibold mb-2">الوصف</label><textarea name="description" required class="w-full px-4 py-3 border border-gray-300 rounded-lg"></textarea></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block font-semibold mb-2">عدد الفصول</label><input type="number" name="chapters" class="w-full px-4 py-3 border border-gray-300 rounded-lg"></div>
                    <div><label class="block font-semibold mb-2">الحالة</label><select name="status" class="w-full px-4 py-3 border border-gray-300 rounded-lg"><option>جاري الكتابة</option><option>مكتملة</option></select></div>
                </div>
                <div><label class="block font-semibold mb-2">صورة الغلاف (URL)</label><input type="url" name="cover" class="w-full px-4 py-3 border border-gray-300 rounded-lg"></div>
                
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-lg font-bold">حفظ</button>
            </form>
        </div>
    </div>

    <!-- مودال التفاصيل -->
    <div id="detailsModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50" onclick="closeDetailsModal()">
        <div id="detailsContent" class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto no-scrollbar" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        // --- 1. إعدادات الأمان والبيانات ---
        
        // كلمة المرور (يمكنك تغييرها من هنا)
        const ADMIN_PASSWORD = "123"; 

        // البيانات الأولية (تستخدم فقط عند أول تشغيل)
        const initialNovelsData = [
            { id: 1, title: "رحلة عبر الزمن", author: "أحمد محمود", category: "خيال علمي", rating: 4.8, reads: "15k", cover: "https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=400", description: "وصف تجريبي...", chapters: 45, status: "مكتملة" },
            { id: 2, title: "أسرار القصر", author: "ليلى السعيد", category: "غموض", rating: 4.6, reads: "12k", cover: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400", description: "وصف تجريبي...", chapters: 38, status: "مكتملة" },
            { id: 3, title: "مدينة الأحلام", author: "سارة حسن", category: "فانتازيا", rating: 4.7, reads: "18k", cover: "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400", description: "وصف تجريبي...", chapters: 41, status: "مكتملة" }
        ];

        let novels = [];
        let favorites = [];
        let searchTerm = '';
        let isAdmin = false;

        // --- 2. التحميل والحفظ (LocalStorage) ---

        function loadData() {
            // محاولة تحميل الروايات من ذاكرة المتصفح
            const savedNovels = localStorage.getItem('mySavedNovels');
            const savedFavs = localStorage.getItem('myFavorites');

            if (savedNovels) {
                novels = JSON.parse(savedNovels);
            } else {
                novels = [...initialNovelsData]; // تحميل البيانات الافتراضية لأول مرة
            }

            if (savedFavs) {
                favorites = JSON.parse(savedFavs);
            }
        }

        function saveData() {
            // حفظ الروايات في المتصفح لتبقى للأبد (على هذا الجهاز)
            localStorage.setItem('mySavedNovels', JSON.stringify(novels));
        }

        function saveFavorites() {
            localStorage.setItem('myFavorites', JSON.stringify(favorites));
        }

        function resetData() {
            if(confirm("هل أنت متأكد؟ سيتم حذف جميع الروايات التي أضفتها والعودة للوضع الأصلي.")) {
                localStorage.removeItem('mySavedNovels');
                location.reload();
            }
        }

        // --- 3. نظام الدخول (Admin) ---

        function adminLogin() {
            const input = prompt("أدخل كلمة مرور المشرف لإضافة روايات:");
            if (input === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('mainBody').classList.add('show-admin');
                document.getElementById('loginBtn').style.display = 'none';
                alert("✅ تم تسجيل الدخول بنجاح! يمكنك الآن إضافة وحذف الروايات.");
                renderNovels(); // إعادة الرسم لإظهار أزرار الحذف
            } else if (input !== null) {
                alert("❌ كلمة المرور خاطئة!");
            }
        }

        function adminLogout() {
            isAdmin = false;
            document.getElementById('mainBody').classList.remove('show-admin');
            document.getElementById('loginBtn').style.display = 'block';
            renderNovels();
        }

        // --- 4. العمليات الأساسية ---

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderNovels();
            lucide.createIcons();
        });

        function renderNovels() {
            const grid = document.getElementById('novelsGrid');
            const filtered = novels.filter(n => n.title.toLowerCase().includes(searchTerm.toLowerCase()));

            document.getElementById('totalNovelsCount').innerText = novels.length;
            document.getElementById('favoritesCount').innerText = favorites.length;

            grid.innerHTML = filtered.map(novel => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-2xl transition cursor-pointer relative group" onclick="openDetails(${novel.id})">
                    <!-- زر الحذف يظهر فقط للمشرف -->
                    ${isAdmin ? `<button onclick="event.stopPropagation(); deleteNovel(${novel.id})" class="absolute top-2 right-2 z-20 bg-red-500 text-white p-2 rounded-full hover:bg-red-700 shadow-lg">✕</button>` : ''}
                    
                    <div class="relative h-64 overflow-hidden">
                        <img src="${novel.cover}" class="w-full h-full object-cover">
                        <div class="absolute top-3 right-3 bg-purple-600 text-white px-3 py-1 rounded-full text-sm font-semibold">${novel.category}</div>
                    </div>
                    
                    <div class="p-5">
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${novel.title}</h3>
                        <p class="text-gray-600 mb-3">بقلم: ${novel.author}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-500">${novel.reads} قراءة</span>
                            <button onclick="event.stopPropagation(); toggleFavorite(${novel.id})" class="text-2xl hover:scale-110 transition">
                                ${favorites.includes(novel.id) ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        function deleteNovel(id) {
            if(confirm("هل أنت متأكد من حذف هذه الرواية نهائياً؟")) {
                novels = novels.filter(n => n.id !== id);
                saveData(); // تحديث التخزين
                renderNovels();
            }
        }

        function handleAddSubmit(e) {
            e.preventDefault();
            const form = e.target;
            
            const newNovel = {
                id: Date.now(),
                title: form.title.value,
                author: form.author.value,
                category: form.category.value,
                rating: 5.0,
                reads: "0",
                cover: form.cover.value || "https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=400",
                description: form.description.value,
                chapters: form.chapters.value || 0,
                status: form.status.value
            };

            novels.unshift(newNovel); // إضافة في البداية
            saveData(); // 💾 حفظ فوري في التخزين المحلي
            
            renderNovels();
            closeAddModal();
            form.reset();
            alert("✅ تم إضافة الرواية وحفظها في المتصفح!");
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            saveFavorites(); // حفظ المفضلة أيضاً
            renderNovels();
        }

        function handleSearch(val) {
            searchTerm = val;
            renderNovels();
        }

        // دوال فتح وإغلاق النوافذ
        function openAddModal() { document.getElementById('addModal').classList.replace('hidden', 'flex'); }
        function closeAddModal() { document.getElementById('addModal').classList.replace('flex', 'hidden'); }
        function openDetails(id) { /* (الكود المختصر للتفاصيل كما في السابق) */ alert("تفاصيل الرواية: " + novels.find(n=>n.id===id).title); }
        function closeDetailsModal() { document.getElementById('detailsModal').classList.replace('flex', 'hidden'); }
    </script>
</body>
</html>
