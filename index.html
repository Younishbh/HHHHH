<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YOUNIS MOVIES 🍿</title>
    
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- المكتبات -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>

    <!-- Plyr Player -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Cairo', 'sans-serif'],
                        en: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        brand: { red: '#E50914' }
                    }
                }
            }
        }
    </script>
    
    <!-- CSS -->
    <style>
        body {
            background-color: #0f0f0f !important;
            color: #e5e5e5;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        
        /* الخلفية المتفاعلة */
        #dynamicBackdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            z-index: -1; filter: blur(20px) brightness(0.3);
            transition: background-image 0.5s ease-in-out;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0f0f0f 80%);
        }

        .glass {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .cat-btn.active { background-color: #E50914; color: white; border-color: #E50914; }
        
        /* شريط الأخبار */
        .news-ticker-container {
            background: #E50914; color: white; font-size: 12px; font-weight: bold;
            padding: 6px 0; overflow: hidden; position: fixed; top: 0; width: 100%; z-index: 60;
        }
        .news-ticker-content {
            display: inline-block; white-space: nowrap; animation: scroll-left 20s linear infinite;
        }
        @keyframes scroll-left { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* قائمة البحث الفوري */
        .search-dropdown {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #1a1a1a; border: 1px solid #333;
            border-radius: 8px; margin-top: 5px;
            max-height: 300px; overflow-y: auto;
            z-index: 100; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .search-item:hover { background: #333; }

        /* Plyr Customization */
        :root { --plyr-color-main: #E50914; --plyr-video-background: #000; }
        .plyr { font-family: 'Outfit', sans-serif !important; height: 100%; width: 100%; border-radius: 8px; }
        .plyr__controls { background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.6), rgba(0,0,0,0.9)) !important; padding-bottom: 25px !important; padding-top: 50px !important; }
        .plyr__control { color: #fff !important; }
        .plyr__control:hover { color: #E50914 !important; }
        .plyr--fullscreen-active video { object-fit: contain; width: 100% !important; height: 100% !important; }
        .video-cover video { object-fit: cover !important; }
        @media (min-width: 768px) { .mobile-only-btn { display: none !important; } }
        .iframe-container { width: 100%; height: 100%; border: none; background: #000; }
        header.fixed { top: 28px; } 
    </style>
</head>

<body class="flex flex-col">

    <!-- الخلفية المتفاعلة -->
    <div id="dynamicBackdrop"></div>

    <!-- شريط الأخبار -->
    <div class="news-ticker-container">
        <div id="newsTicker" class="news-ticker-content">جاري تحميل أحدث الأفلام...</div>
    </div>

    <!-- Navbar -->
    <header class="fixed w-full z-50">
        <div class="glass">
            <div class="container mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-1 cursor-pointer" onclick="window.location.href = window.location.pathname">
                    <h1 class="font-en text-2xl font-black text-white">
                        YOUNIS <span class="text-brand-red">MOVIES</span>
                    </h1>
                </div>
                <!-- البحث الفوري -->
                <div class="flex items-center gap-3 relative">
                     <div class="relative group">
                        <input type="text" id="searchInput" placeholder="بحث..." 
                            class="bg-white/10 border border-white/10 text-white text-sm px-3 py-1.5 rounded-full w-32 focus:w-56 transition-all outline-none"
                            oninput="handleInstantSearch(this.value)" onblur="setTimeout(()=>document.getElementById('searchDropdown').style.display='none', 200)">
                        
                        <!-- قائمة النتائج -->
                        <div id="searchDropdown" class="search-dropdown hide-scroll"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <div id="heroSection" class="relative h-[85vh] w-full hidden mt-8">
        <div class="absolute inset-0">
            <img id="heroImage" src="" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0f0f0f] via-black/40 to-transparent"></div>
        </div>
        <div class="absolute bottom-0 left-0 w-full px-6 pb-20 z-10 max-w-3xl">
            <span class="bg-brand-red text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase shadow-lg">New Release</span>
            <h2 id="heroTitle" class="font-en text-4xl md:text-6xl font-black leading-tight my-2 text-white drop-shadow-xl"></h2>
            <div class="flex items-center gap-3 text-xs text-gray-300 mb-4 font-en font-bold">
                <span id="heroYear"></span> • <span id="heroCategory"></span> • HD
            </div>
            <p id="heroDesc" class="text-gray-300 text-sm md:text-base line-clamp-3 mb-6 max-w-xl"></p>
            <button id="heroPlayBtn" class="bg-brand-red text-white px-6 py-3 rounded-lg font-bold flex items-center gap-2 shadow-lg hover:bg-red-700 transition">
                <i data-lucide="info" class="w-5 h-5"></i> التفاصيل
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pb-20 pt-28 md:pt-12">
        <div id="categoriesContainer" class="flex gap-2 overflow-x-auto hide-scroll mb-6 pb-2"></div>
        <h3 id="listTitle" class="text-xl font-bold text-white mb-4 flex items-center gap-2 border-r-4 border-brand-red pr-3">المكتبة</h3>
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="w-10 h-10 border-4 border-brand-red border-t-transparent rounded-full animate-spin"></div>
        </div>
        <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-6"></div>
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 opacity-50">
            <i data-lucide="film" class="w-12 h-12 text-gray-400 mb-2"></i>
            <p class="text-sm font-bold">لا توجد أفلام</p>
        </div>
    </main>

    <!-- (New) Movie Details Modal -->
    <div id="detailsModal" class="fixed inset-0 z-[90] hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#141414] w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl border border-white/10 relative flex flex-col md:flex-row max-h-[90vh]">
            <button onclick="closeDetailsModal()" class="absolute top-4 right-4 z-10 bg-black/50 p-2 rounded-full hover:bg-white/20 text-white">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <!-- Poster -->
            <div class="w-full md:w-2/5 h-64 md:h-auto relative">
                <img id="modalPoster" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-[#141414] via-transparent to-transparent md:hidden"></div>
            </div>
            
            <!-- Info -->
            <div class="w-full md:w-3/5 p-6 md:p-10 flex flex-col overflow-y-auto">
                <h2 id="modalTitleText" class="text-3xl md:text-4xl font-bold text-white mb-2 font-en"></h2>
                <div class="flex items-center gap-3 text-sm text-gray-400 mb-6">
                    <span id="modalYear" class="border border-gray-600 px-2 rounded"></span>
                    <span id="modalCategory" class="text-brand-red font-bold"></span>
                    <span>HD</span>
                </div>
                
                <p id="modalDescText" class="text-gray-300 text-sm leading-relaxed mb-8 flex-1"></p>
                
                <div class="flex flex-col gap-3 mt-auto">
                    <button id="modalPlayBtn" class="w-full bg-brand-red hover:bg-red-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 text-lg transition shadow-lg shadow-red-900/30">
                        <i data-lucide="play" class="w-6 h-6 fill-white"></i> مشاهدة الفيلم
                    </button>
                    <button onclick="shareMovie()" class="w-full bg-white/10 hover:bg-white/20 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition">
                        <i data-lucide="share-2" class="w-5 h-5"></i> مشاركة الرابط
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal" class="fixed inset-0 z-[100] hidden bg-black flex flex-col">
        <div class="flex items-center justify-between px-4 py-3 bg-[#111] border-b border-white/10 relative z-50">
            <div>
                <h3 id="playerTitle" class="font-bold text-base text-white truncate max-w-[200px]"></h3>
                <p class="text-[10px] text-brand-red font-bold tracking-widest">YOUNIS PLAYER</p>
            </div>
            <button onclick="closePlayer()" class="bg-white/10 p-2 rounded-full hover:bg-white/20 transition">
                <i data-lucide="x" class="w-5 h-5 text-white"></i>
            </button>
        </div>
        <div class="flex-1 bg-black flex items-center justify-center relative w-full h-full">
            <div id="playerWrapper" class="w-full h-full bg-black relative flex items-center justify-center"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTn9dyAUgn8HOEIsOE8O9y_UJ1CJ9IuSdGIFpSawVta28mee1fFTKqoKZ2vo2t8nCPh0vUCduSZ8KxP/pub?output=csv";
        let allMovies = [];
        let plyrInstance = null;
        let hlsInstance = null;
        let isVideoFit = true;
        let currentCategory = 'الكل';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchMovies();
        });

        function fetchMovies() {
            const freshUrl = SHEET_URL + "&t=" + Date.now();
            
            Papa.parse(freshUrl, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    allMovies = results.data;
                    document.getElementById('loading').style.display = 'none';
                    if(allMovies.length > 0) {
                        allMovies.reverse();
                        allMovies.forEach((movie, index) => { if (index < 10) movie.isNew = true; });

                        const latestMovie = allMovies[0];
                        document.getElementById('newsTicker').innerText = `🔥 وصل حديثاً: فيلم ${latestMovie.Title} (${latestMovie.Year}) - شاهده الآن بجودة عالية! 🔥`;
                        updateBackdrop(latestMovie.Cover);

                        setupHero(latestMovie);
                        setupCategories();
                        renderMovies(allMovies);

                        // التحقق من الرابط المباشر (Deep Linking)
                        checkDeepLink();
                    } else {
                        document.getElementById('emptyState').classList.remove('hidden');
                        document.getElementById('emptyState').classList.add('flex');
                    }
                },
                error: function(err) {
                    document.getElementById('loading').innerHTML = '<p class="text-red-500">خطأ في الاتصال</p>';
                }
            });
        }

        // ========================
        // 1. Deep Linking System
        // ========================
        function checkDeepLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const movieName = urlParams.get('movie');
            
            if (movieName) {
                // البحث عن الفيلم بالاسم
                const targetMovie = allMovies.find(m => m.Title === movieName);
                if (targetMovie) {
                    openDetails(targetMovie);
                }
            }
        }

        function updateUrl(movieTitle) {
            if (history.pushState) {
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?movie=' + encodeURIComponent(movieTitle);
                window.history.pushState({path:newUrl},'',newUrl);
            }
        }

        function clearUrl() {
            if (history.pushState) {
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.pushState({path:newUrl},'',newUrl);
            }
        }

        // ========================
        // 2. Movie Details Modal
        // ========================
        function openDetails(movie) {
            updateUrl(movie.Title); // تحديث الرابط في الأعلى
            
            const modal = document.getElementById('detailsModal');
            document.getElementById('modalPoster').src = movie.Cover;
            document.getElementById('modalTitleText').innerText = movie.Title;
            document.getElementById('modalYear').innerText = movie.Year || 'N/A';
            document.getElementById('modalCategory').innerText = movie.Category;
            document.getElementById('modalDescText').innerText = movie.Description || 'لا يتوفر وصف لهذا الفيلم حالياً.';
            
            const playBtn = document.getElementById('modalPlayBtn');
            playBtn.onclick = () => {
                closeDetailsModal(false); // إغلاق التفاصيل بدون مسح الرابط
                openPlayer(movie); // فتح المشغل
            };

            modal.classList.remove('hidden');
        }

        function closeDetailsModal(clear = true) {
            document.getElementById('detailsModal').classList.add('hidden');
            if(clear) clearUrl(); // مسح الرابط عند الإغلاق اليدوي
        }

        function shareMovie() {
            if (navigator.share) {
                navigator.share({
                    title: document.getElementById('modalTitleText').innerText,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط الفيلم!');
            }
        }

        // ========================
        // 3. Instant Search
        // ========================
        function handleInstantSearch(query) {
            const dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = '';
            
            if (!query.trim()) {
                dropdown.style.display = 'none';
                renderMovies(allMovies); // إعادة القائمة الأصلية
                return;
            }

            const filtered = allMovies.filter(m => m.Title.toLowerCase().includes(query.toLowerCase()));
            
            // تحديث الشبكة الرئيسية أيضاً
            renderMovies(filtered);

            // تحديث القائمة المنسدلة
            if (filtered.length > 0) {
                dropdown.style.display = 'block';
                filtered.slice(0, 5).forEach(movie => {
                    const item = document.createElement('div');
                    item.className = 'search-item flex items-center gap-3 p-2 cursor-pointer transition border-b border-white/5';
                    item.innerHTML = `
                        <img src="${movie.Cover}" class="w-10 h-14 object-cover rounded">
                        <div>
                            <h4 class="text-white text-sm font-bold">${movie.Title}</h4>
                            <p class="text-gray-400 text-xs">${movie.Year}</p>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('searchInput').value = '';
                        dropdown.style.display = 'none';
                        openDetails(movie);
                    };
                    dropdown.appendChild(item);
                });
            } else {
                dropdown.style.display = 'none';
            }
        }

        // ========================
        // Core Functions
        // ========================
        function updateBackdrop(imageUrl) {
            if(imageUrl) document.getElementById('dynamicBackdrop').style.backgroundImage = `url('${imageUrl}')`;
        }

        function setupCategories() {
            const container = document.getElementById('categoriesContainer');
            const categories = ['الكل', ...new Set(allMovies.map(m => m.Category).filter(c => c))];
            container.innerHTML = categories.map(cat => `
                <button onclick="filterMovies('${cat}')" 
                    class="cat-btn ${cat === 'الكل' ? 'active' : ''} bg-white/10 border border-white/10 text-white px-4 py-1.5 rounded-full text-xs whitespace-nowrap transition">
                    ${cat}
                </button>
            `).join('');
        }

        function setupHero(movie) {
            if(!movie) return;
            document.getElementById('heroSection').classList.remove('hidden');
            document.querySelector('main').classList.remove('pt-24');
            document.getElementById('heroImage').src = movie.Cover;
            document.getElementById('heroTitle').innerText = movie.Title;
            document.getElementById('heroDesc').innerText = movie.Description || "شاهد هذا الفيلم الآن.";
            document.getElementById('heroYear').innerText = movie.Year || "2024";
            document.getElementById('heroCategory').innerText = movie.Category;
            document.getElementById('heroPlayBtn').onclick = () => openDetails(movie); // Changed to openDetails
        }

        function renderMovies(movies) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            if(movies.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('flex');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('flex');

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'group relative aspect-[2/3] bg-[#1a1a1a] rounded-lg overflow-hidden cursor-pointer shadow-lg hover:shadow-brand-red/20 transition-all duration-300';
                card.onmouseenter = () => updateBackdrop(movie.Cover);
                card.onclick = () => openDetails(movie); // Changed to openDetails
                
                const newBadge = movie.isNew ? 
                    `<div class="absolute top-2 left-2 bg-green-600 text-white text-[9px] font-bold px-2 py-0.5 rounded shadow-lg animate-pulse">جديد 🔥</div>` : '';

                card.innerHTML = `
                    <img src="${movie.Cover}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition duration-500" loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent opacity-100"></div>
                    <div class="absolute top-2 right-2 bg-brand-red text-white text-[9px] font-bold px-1.5 py-0.5 rounded">HD</div>
                    ${newBadge}
                    <div class="absolute bottom-0 p-3 w-full">
                        <h4 class="font-bold text-sm text-white truncate mb-1">${movie.Title}</h4>
                        <div class="flex justify-between items-center text-[10px] text-gray-400">
                            <span>${movie.Category}</span>
                            <span>${movie.Year || ''}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterMovies(cat) {
            currentCategory = cat;
            document.getElementById('listTitle').innerText = cat === 'الكل' ? 'المكتبة' : cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText === cat) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            const filtered = cat === 'الكل' ? allMovies : allMovies.filter(m => m.Category && m.Category.includes(cat));
            renderMovies(filtered);
        }

        // ===========================================
        //  PLAYER LOGIC
        // ===========================================
        function openPlayer(movie) {
            const link = movie.Link;
            const title = movie.Title;
            const modal = document.getElementById('playerModal');
            const wrapper = document.getElementById('playerWrapper');
            document.getElementById('playerTitle').innerText = title;

            if (plyrInstance) { plyrInstance.destroy(); plyrInstance = null; }
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            wrapper.innerHTML = '';
            isVideoFit = true;
            modal.classList.remove('hidden');

            const isYoutube = link.includes('youtube.com') || link.includes('youtu.be');
            const isM3U8 = link.includes('.m3u8');
            const q1080 = movie.Link_1080 && movie.Link_1080.trim() !== "";
            const hasMultipleQualities = q1080 || (movie.Link_720 && movie.Link_720.trim() !== "");

            if (isYoutube) {
                const videoId = link.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/))([^&?]*)/)?.[1];
                wrapper.innerHTML = `<div id="newPlayer" data-plyr-provider="youtube" data-plyr-embed-id="${videoId}"></div>`;
                initPlyr('#newPlayer');
            } else if (isM3U8) {
                wrapper.innerHTML = `<video id="newPlayer" playsinline controls class="w-full h-full" crossorigin></video>`;
                const video = document.getElementById('newPlayer');
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({xhrSetup: function(xhr, url) { xhr.withCredentials = false; }});
                    hlsInstance.loadSource(link);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() { initPlyr(video); });
                    hlsInstance.on(Hls.Events.ERROR, function (event, data) { if (data.fatal) loadIframeFallback(wrapper, link); });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = link; initPlyr(video);
                } else { loadIframeFallback(wrapper, link); }
            } else if (hasMultipleQualities) {
                let sources = [];
                sources.push({ src: link, type: 'video/mp4', size: 1080 }); 
                if(movie.Link_1080) sources.push({ src: movie.Link_1080, type: 'video/mp4', size: 1080 });
                if(movie.Link_720) sources.push({ src: movie.Link_720, type: 'video/mp4', size: 720 });
                if(movie.Link_480) sources.push({ src: movie.Link_480, type: 'video/mp4', size: 480 });
                if(movie.Link_360) sources.push({ src: movie.Link_360, type: 'video/mp4', size: 360 });
                wrapper.innerHTML = `<video id="newPlayer" playsinline controls class="w-full h-full"></video>`;
                initPlyr(document.getElementById('newPlayer'), sources);
            } else if (link.includes('.mp4') || link.includes('.mkv')) {
                wrapper.innerHTML = `<video id="newPlayer" playsinline controls class="w-full h-full" src="${link}"></video>`;
                initPlyr('#newPlayer');
            } else {
                loadIframeFallback(wrapper, link);
            }
        }

        function loadIframeFallback(wrapper, link) {
            const proxyPlayer = `https://ipcim.com/en/m3u8-player/index.html?source=${link}`;
            wrapper.innerHTML = `<iframe src="${proxyPlayer}" class="iframe-container" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        }

        function initPlyr(element, sources = null) {
            const options = {
                controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
                settings: ['quality', 'speed'],
                seekTime: 5,
                autoplay: true,
                resetOnEnd: true,
            };
            plyrInstance = new Plyr(element, options);
            if (sources) { plyrInstance.source = { type: 'video', sources: sources }; }
            plyrInstance.on('ready', () => {
                addCustomButtons(plyrInstance);
                plyrInstance.play().catch(e => console.log("Autoplay blocked"));
            });
        }

        function addCustomButtons(player) {
            if(window.innerWidth > 768) return; 
            const controls = document.querySelector('.plyr__controls');
            if(!controls || document.querySelector('.mobile-only-btn')) return;

            const scaleBtn = document.createElement('button');
            scaleBtn.className = 'plyr__controls__item plyr__control mobile-only-btn';
            scaleBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>`;
            scaleBtn.onclick = () => {
                const plyrContainer = document.querySelector('.plyr');
                if(isVideoFit) {
                    plyrContainer.classList.add('video-cover');
                    scaleBtn.style.color = '#E50914';
                } else {
                    plyrContainer.classList.remove('video-cover');
                    scaleBtn.style.color = '#fff';
                }
                isVideoFit = !isVideoFit;
            };

            const rotateBtn = document.createElement('button');
            rotateBtn.className = 'plyr__controls__item plyr__control mobile-only-btn';
            rotateBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`;
            rotateBtn.onclick = () => {
                if(player.fullscreen.active) {
                    player.fullscreen.exit();
                    if(screen.orientation) screen.orientation.unlock();
                } else {
                    player.fullscreen.enter();
                    if(screen.orientation) screen.orientation.lock('landscape').catch(()=>{});
                }
            };
            
            const fsBtn = controls.querySelector('[data-plyr="fullscreen"]');
            if(fsBtn) {
                controls.insertBefore(scaleBtn, fsBtn);
                controls.insertBefore(rotateBtn, fsBtn);
            } else {
                controls.appendChild(scaleBtn);
                controls.appendChild(rotateBtn);
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const wrapper = document.getElementById('playerWrapper');
            modal.classList.add('hidden');
            if (plyrInstance) {
                if(document.fullscreenElement) document.exitFullscreen();
                plyrInstance.destroy();
                plyrInstance = null;
            }
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            wrapper.innerHTML = '';
        }
    </script>
</body>
</html>
