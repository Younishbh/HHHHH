<script>
        // رابط ملف البيانات الخاص بك
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTn9dyAUgn8HOEIsOE8O9y_UJ1CJ9IuSdGIFpSawVta28mee1fFTKqoKZ2vo2t8nCPh0vUCduSZ8KxP/pub?output=csv";

        let allMovies = [];
        let plyrInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchMovies();
        });

        // 1. جلب البيانات
        function fetchMovies() {
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allMovies = results.data;
                    document.getElementById('loading').style.display = 'none';
                    if(allMovies.length > 0) {
                        setupHero(allMovies[0]); 
                        renderMovies(allMovies);
                    } else {
                        document.getElementById('emptyState').classList.remove('hidden');
                        document.getElementById('emptyState').classList.add('flex');
                    }
                },
                error: function() {
                    document.getElementById('loading').innerHTML = '<p class="text-red-500">حدث خطأ في الاتصال</p>';
                }
            });
        }

        // 2. إعداد الهيرو
        function setupHero(movie) {
            if(!movie) return;
            document.getElementById('heroSection').classList.remove('hidden');
            document.getElementById('heroImage').src = movie.Cover;
            document.getElementById('heroTitle').innerText = movie.Title;
            document.getElementById('heroDesc').innerText = movie.Description || "شاهد هذا العمل السينمائي المميز حصرياً.";
            document.getElementById('heroYear').innerText = movie.Year || "2024";
            document.getElementById('heroCategory').innerText = movie.Category;
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(movie.Link, movie.Title);
        }

        // 3. عرض الأفلام
        function renderMovies(movies) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            if(movies.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('flex');
                return;
            }
            
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('flex');

            movies.forEach((movie) => {
                const card = document.createElement('div');
                card.className = 'group relative aspect-[2/3] bg-[#1a1a1a] rounded-lg overflow-hidden cursor-pointer shadow-lg hover:shadow-2xl transition-all duration-500 hover:-translate-y-2';
                card.onclick = () => openPlayer(movie.Link, movie.Title);
                
                card.innerHTML = `
                    <img src="${movie.Cover}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition duration-500 transform group-hover:scale-110" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=No+Cover'">
                    <div class="absolute inset-0 bg-card-gradient opacity-90"></div>
                    <div class="absolute top-2 right-2 bg-brand-red text-white text-[10px] font-bold px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition duration-300">HD</div>
                    <div class="absolute bottom-0 p-4 w-full translate-y-2 group-hover:translate-y-0 transition duration-300">
                        <h4 class="font-bold text-base text-white truncate mb-1">${movie.Title}</h4>
                        <div class="flex justify-between items-center text-xs text-gray-400 group-hover:text-gray-200">
                            <span>${movie.Category}</span>
                            <span>${movie.Year || ''}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterMovies(category) {
            document.getElementById('listTitle').innerText = category === 'الكل' ? 'أحدث الإضافات' : category;
            if(category === 'الكل') {
                renderMovies(allMovies);
            } else {
                const filtered = allMovies.filter(m => m.Category && m.Category.includes(category));
                renderMovies(filtered);
            }
        }

        function handleSearch(query) {
            const lowerQuery = query.toLowerCase();
            const filtered = allMovies.filter(m => m.Title.toLowerCase().includes(lowerQuery));
            renderMovies(filtered);
        }

        // ==========================================
        //  وظيفة زر التدوير (Screen Rotate)
        // ==========================================
        function addRotateButton(player) {
            if(window.innerWidth > 768) return; // للموبايل فقط

            const controls = document.querySelector('.plyr__controls');
            if(!controls) return;

            // التأكد من عدم وجود الزر مسبقاً
            if(document.querySelector('.rotate-icon-btn')) return;

            const rotateBtn = document.createElement('button');
            rotateBtn.type = 'button';
            rotateBtn.className = 'plyr__controls__item plyr__control rotate-icon-btn';
            rotateBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            `;
            
            // إضافته قبل زر ملء الشاشة
            const fullscreenBtn = controls.querySelector('[data-plyr="fullscreen"]');
            if (fullscreenBtn) {
                controls.insertBefore(rotateBtn, fullscreenBtn);
            } else {
                controls.appendChild(rotateBtn);
            }

            rotateBtn.addEventListener('click', async () => {
                try {
                    if (player.fullscreen.active) {
                        player.fullscreen.exit();
                        screen.orientation.unlock();
                    } else {
                        player.fullscreen.enter();
                        await screen.orientation.lock('landscape');
                    }
                } catch (err) {
                    // في حال فشل القفل (بعض المتصفحات)، نقوم بملء الشاشة فقط
                    player.fullscreen.toggle();
                }
            });
        }

        // ==========================================
        //  فتح المشغل (Clean Build Method)
        // ==========================================
        function openPlayer(link, title) {
            const modal = document.getElementById('playerModal');
            const wrapper = document.getElementById('playerWrapper');
            
            document.getElementById('playerTitle').innerText = title;

            // 1. تدمير المشغل القديم إذا وجد
            if (plyrInstance) {
                plyrInstance.destroy();
                plyrInstance = null;
            }

            // 2. تنظيف الحاوية بالكامل (هذا يحل مشكلة ظهور الفيديو القديم)
            wrapper.innerHTML = '';

            // 3. إنشاء عنصر جديد بناءً على نوع الرابط
            let newElementHTML = '';
            
            if (link.includes('youtube.com') || link.includes('youtu.be')) {
                // يوتيوب
                const videoId = getYoutubeId(link);
                newElementHTML = `<div id="uniquePlayer" data-plyr-provider="youtube" data-plyr-embed-id="${videoId}"></div>`;
            } else {
                // MP4 (شبكتي)
                newElementHTML = `<video id="uniquePlayer" playsinline controls class="w-full h-full" src="${link}"></video>`;
            }

            // حقن العنصر الجديد
            wrapper.innerHTML = newElementHTML;

            // 4. إظهار النافذة
            modal.classList.remove('hidden');

            // 5. تهيئة Plyr على العنصر الجديد
            const playerElement = document.getElementById('uniquePlayer');
            
            plyrInstance = new Plyr(playerElement, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
                settings: ['quality', 'speed'],
                autoplay: true
            });

            // 6. إضافة زر التدوير بمجرد جاهزية المشغل
            plyrInstance.on('ready', () => {
                addRotateButton(plyrInstance);
                plyrInstance.play().catch(() => console.log("Autoplay blocked"));
            });
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const wrapper = document.getElementById('playerWrapper');
            
            modal.classList.add('hidden');
            
            // تنظيف وإيقاف
            if (plyrInstance) {
                plyrInstance.destroy();
                plyrInstance = null;
            }
            wrapper.innerHTML = ''; // مسح المحتوى تماماً
        }

        function getYoutubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }
    </script>
</body>
</html>
