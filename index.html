<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الروايات - قراءة PDF</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Tajawal', 'sans-serif'] } }
            }
        }
    </script>

    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .admin-only { display: none !important; }
        .show-admin .admin-only { display: flex !important; }
    </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800" id="mainBody">

    <!-- الرأس -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="library" class="w-8 h-8"></i>
                    <h1 class="text-2xl font-bold">مكتبة الروايات المجانية</h1>
                </div>
                
                <div class="flex gap-3 items-center">
                    <!-- أزرار التحكم -->
                    <button id="loginBtn" onclick="adminLogin()" class="px-3 py-1 bg-white/10 hover:bg-white/20 rounded text-sm border border-white/20">
                        👨‍💻 دخول المشرف
                    </button>
                    
                    <button onclick="adminLogout()" class="admin-only px-3 py-1 bg-red-500 hover:bg-red-600 rounded text-sm">
                        خروج
                    </button>

                    <button onclick="openAddModal()" class="admin-only px-4 py-2 bg-green-500 hover:bg-green-600 rounded-lg font-bold flex items-center gap-2 shadow-lg">
                        <i data-lucide="plus"></i> إضافة رواية
                    </button>
                </div>
            </div>
            
            <!-- البحث -->
            <div class="mt-4 relative max-w-xl mx-auto">
                <input type="text" placeholder="ابحث عن رواية أو مؤلف..." 
                    class="w-full pr-10 pl-4 py-2 rounded-full text-gray-800 border-2 border-indigo-400 focus:outline-none focus:border-indigo-200"
                    oninput="handleSearch(this.value)">
                <i data-lucide="search" class="absolute right-3 top-2.5 text-gray-400 w-5 h-5"></i>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <div class="container mx-auto px-4 py-8">
        
        <!-- أدوات المشرف (تظهر فقط بعد تسجيل الدخول) -->
        <div class="admin-only bg-yellow-50 border-r-4 border-yellow-400 p-4 mb-6 rounded shadow-sm">
            <div class="flex justify-between items-center w-full">
                <p class="font-bold text-yellow-800">⚠️ أنت في وضع المشرف: يمكنك إضافة وحذف الروايات.</p>
                <button onclick="resetData()" class="text-red-600 text-sm underline hover:text-red-800">حذف جميع البيانات</button>
            </div>
        </div>

        <!-- شبكة الروايات -->
        <div id="novelsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- يتم التعبئة بالجافاسكريبت -->
        </div>

        <!-- رسالة عند عدم وجود روايات -->
        <div id="emptyState" class="hidden text-center py-20 text-gray-400">
            <i data-lucide="book-x" class="w-16 h-16 mx-auto mb-4 opacity-50"></i>
            <p class="text-xl">لا توجد روايات حالياً</p>
        </div>
    </div>

    <!-- نافذة إضافة رواية -->
    <div id="addModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 overflow-y-auto" onclick="closeAddModal()">
        <div class="bg-white rounded-xl max-w-lg w-full shadow-2xl transform transition-all scale-100" onclick="event.stopPropagation()">
            <div class="bg-indigo-700 text-white p-4 rounded-t-xl flex justify-between items-center">
                <h2 class="text-xl font-bold">إضافة رواية جديدة (PDF)</h2>
                <button onclick="closeAddModal()" class="hover:bg-white/20 rounded-full p-1"><i data-lucide="x"></i></button>
            </div>
            
            <form onsubmit="handleAddSubmit(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">عنوان الرواية</label>
                    <input type="text" name="title" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">المؤلف</label>
                    <input type="text" name="author" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- حقل PDF الجديد -->
                <div class="bg-blue-50 p-3 rounded-lg border border-blue-200">
                    <label class="block text-sm font-bold text-blue-800 mb-1"> رابط ملف PDF (للقراءة) *</label>
                    <input type="url" name="pdfLink" required placeholder="https://example.com/file.pdf" 
                           class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                           title="يجب وضع رابط مباشر لملف PDF">
                    <p class="text-xs text-blue-600 mt-1">تلميح: يمكنك وضع رابط من Google Drive أو موقع تحميل مباشر.</p>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">رابط صورة الغلاف</label>
                    <input type="url" name="cover" placeholder="https://..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">التصنيف</label>
                    <select name="category" class="w-full px-3 py-2 border rounded-lg">
                        <option>روايات عالمية</option>
                        <option>رعب وغموض</option>
                        <option>تاريخية</option>
                        <option>تنمية بشرية</option>
                        <option>خيال علمي</option>
                    </select>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition shadow-lg">حفظ ونشر</button>
                    <button type="button" onclick="closeAddModal()" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 font-semibold">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- الإعدادات ---
        const ADMIN_PASS = "123"; // كلمة المرور
        let novels = [];
        let isAdmin = false;
        let searchTerm = '';

        // بيانات تجريبية (تظهر فقط أول مرة)
        const initialData = [
            {
                id: 1, 
                title: "أرض زيكولا", 
                author: "عمرو عبد الحميد", 
                category: "خيال", 
                cover: "https://images.unsplash.com/photo-1629198688000-71f23e745b6e?w=400",
                pdfLink: "https://www.google.com", // رابط تجريبي
                reads: 120
            }
        ];

        // --- تشغيل النظام ---
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderNovels();
            lucide.createIcons();
        });

        function loadData() {
            const saved = localStorage.getItem('pdfNovelsLibrary');
            if (saved) {
                novels = JSON.parse(saved);
            } else {
                novels = initialData;
            }
        }

        function saveData() {
            localStorage.setItem('pdfNovelsLibrary', JSON.stringify(novels));
        }

        // --- وظائف العرض ---
        function renderNovels() {
            const grid = document.getElementById('novelsGrid');
            const empty = document.getElementById('emptyState');
            
            const filtered = novels.filter(n => n.title.toLowerCase().includes(searchTerm.toLowerCase()));

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            } else {
                empty.classList.add('hidden');
            }

            grid.innerHTML = filtered.map(novel => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 border border-gray-100 flex flex-col h-full relative group">
                    
                    ${isAdmin ? `
                    <button onclick="deleteNovel(${novel.id})" class="absolute top-2 right-2 bg-red-600 text-white p-2 rounded-full shadow-lg z-10 hover:bg-red-700" title="حذف الرواية">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    ` : ''}

                    <div class="h-48 overflow-hidden relative bg-gray-200">
                        <img src="${novel.cover || 'https://via.placeholder.com/400x600?text=No+Cover'}" alt="${novel.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute bottom-0 w-full bg-gradient-to-t from-black/70 to-transparent p-3">
                            <span class="text-white text-xs bg-indigo-600 px-2 py-1 rounded-full">${novel.category}</span>
                        </div>
                    </div>
                    
                    <div class="p-4 flex-1 flex flex-col">
                        <h3 class="font-bold text-lg text-gray-800 mb-1">${novel.title}</h3>
                        <p class="text-gray-500 text-sm mb-4">✍️ ${novel.author}</p>
                        
                        <div class="mt-auto pt-4 border-t border-gray-100">
                            <a href="${novel.pdfLink}" target="_blank" 
                               class="flex items-center justify-center gap-2 w-full bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition shadow-md">
                                <i data-lucide="book-open" class="w-4 h-4"></i>
                                قراءة الرواية (PDF)
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // --- إضافة وحذف ---
        function handleAddSubmit(e) {
            e.preventDefault();
            const form = e.target;
            
            const newNovel = {
                id: Date.now(),
                title: form.title.value,
                author: form.author.value,
                category: form.category.value,
                cover: form.cover.value,
                pdfLink: form.pdfLink.value, // حفظ رابط الـ PDF
                reads: 0
            };

            novels.unshift(newNovel);
            saveData();
            renderNovels();
            closeAddModal();
            form.reset();
            alert("✅ تم إضافة الرواية ورابط القراءة بنجاح!");
        }

        function deleteNovel(id) {
            if(confirm("هل أنت متأكد من حذف هذه الرواية؟ لا يمكن التراجع.")) {
                novels = novels.filter(n => n.id !== id);
                saveData();
                renderNovels();
            }
        }

        // --- تسجيل الدخول والبحث ---
        function adminLogin() {
            const input = prompt("🔐 أدخل كلمة مرور المشرف:");
            if (input === ADMIN_PASS) {
                isAdmin = true;
                document.getElementById('mainBody').classList.add('show-admin');
                document.getElementById('loginBtn').style.display = 'none';
                renderNovels();
                alert("أهلاً بك أيها المشرف");
            } else if (input !== null) {
                alert("كلمة المرور خاطئة");
            }
        }

        function adminLogout() {
            isAdmin = false;
            document.getElementById('mainBody').classList.remove('show-admin');
            document.getElementById('loginBtn').style.display = 'block';
            renderNovels();
        }

        function handleSearch(val) {
            searchTerm = val;
            renderNovels();
        }

        function resetData() {
            if(confirm("تحذير: سيتم مسح كل شيء! هل أنت متأكد؟")) {
                localStorage.removeItem('pdfNovelsLibrary');
                location.reload();
            }
        }

        // --- نوافذ ---
        function openAddModal() { document.getElementById('addModal').classList.replace('hidden', 'flex'); }
        function closeAddModal() { document.getElementById('addModal').classList.replace('flex', 'hidden'); }

    </script>
</body>
</html>
